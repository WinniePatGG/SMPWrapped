# SMPWrapped Configuration
# ========================

# Web server settings
web:
  enabled: true
  # Bind address - use 127.0.0.1 for localhost only (recommended)
  # Use 0.0.0.0 only if you know what you're doing and have a firewall
  host: 127.0.0.1
  port: 8080
  # Public base URL for share links (change to your domain)
  public-base-url: http://localhost:8080
  # Cache duration for web responses (seconds)
  cache-seconds: 300
  # When a player opens their Wrapped, it is compared against their live stats.
  # If anything changed, the snapshot is rebuilt automatically, but at most once
  # every N seconds so repeated reloads cannot hammer the database.
  # Set to 0 to always serve the stored snapshot and only rebuild on schedule.
  snapshot-refresh-seconds: 30

# Database settings
database:
  # Path relative to plugin folder
  path: smpwrapped.db

# Current season
# All tracked stats are recorded under this id. The admin commands keep this value
# up to date for you, so you rarely need to edit it by hand.
# The season lifecycle is: create -> play -> end -> publish
#   /wrapped admin create <name>   creates the season, makes it current and ends the old one
#   /wrapped admin switch <season> records stats into an existing season
#   /wrapped admin end <season>    stops the season, optionally auto-publishing it
#   /wrapped admin publish <season> archives it (its Wrapped stays readable)
season:
  current: season-1

# Tracking toggles
tracking:
  playtime: true
  blocks: true
  distance: true
  mobs: true
  deaths: true
  damage: true
  crafting: true
  fishing: true
  dimensions: true
  sessions: true
  achievements: true
  # Ignore blocks mined and placed in Creative and Spectator mode.
  # Applied to mining and placing so creative building cannot inflate the stats.
  ignore-creative: true

# Autosave interval (seconds)
# How often changed stats are written to the database. Only players whose stats
# actually changed are written, so a low interval is cheap. Minimum 5.
# Stats are also flushed immediately when a player leaves and on shutdown.
autosave:
  interval-seconds: 30

# Rate limiting
rate-limit:
  requests-per-minute: 60

# Admin settings
admin:
  # API token for admin endpoints - CHANGE THIS!
  # Generated automatically on first start if not set
  token: ""

# Leaderboard settings
leaderboard:
  public: true
  min-sample-size: 3

# Privacy settings
privacy:
  player-profiles-public: true
  allow-player-opt-out: true

# Avatar settings
avatar:
  # URL template for player avatars. {uuid} will be replaced with player UUID
  # Set to empty string to disable avatars
  url-template: "https://mc-heads.net/avatar/{uuid}/64"

# Server branding
branding:
  server-name: "Our SMP Server"
  server-icon-url: ""

# Share card settings
share-card:
  enabled: true
  footer: "Wrapped with SMPWrapped"

# Publication settings
publication:
  # Publish (archive) a season automatically as soon as it is ended
  auto-publish-on-end: false

# Scheduled automatic Wrapped generation.
# Times use the server's local time zone. If the server is offline when a run
# is due, it will be generated shortly after the next startup.
schedule:
  weekly:
    enabled: true
    # Day of the week: MONDAY, TUESDAY, ... SUNDAY (or 1-7 where 1 = Monday)
    day: MONDAY
    # 24-hour time, HH:mm
    time: "20:00"
  monthly:
    enabled: true
    # Day of the month (1-31). In shorter months it runs on the last day.
    day: 1
    # 24-hour time, HH:mm
    time: "20:00"

# Advanced logging
# Every failure is logged with a full stack trace, the thread it happened on and
# structured key=value context. Errors are also written to plugins/SMPWrapped/logs/.
logging:
  # Minimum level that gets logged: TRACE, DEBUG, INFO, WARN, ERROR, FATAL
  level: INFO
  # Mirror log records to the server console
  console: true
  # Rotate a structured log file next to the database
  file:
    enabled: true
    # Rotate once the file grows past this size (0 = never rotate)
    max-size-mb: 5
    # How many rotated .gz archives to keep
    keep-files: 5
    # Async queue size. Lines are dropped (and counted) if the disk cannot keep up.
    queue-capacity: 8192
  # Print full stack traces with error entries
  stack-traces: true
  # Maximum stack frames per exception (cause chain shares this budget)
  stack-trace-depth: 30
  # Collapse identical repeating errors instead of flooding the console
  dedupe:
    enabled: true
    # Log this many occurrences, then start throttling
    threshold: 5
    # Occurrence counter resets after this many seconds
    window-seconds: 300
    # Minimum seconds between two logs of the same error once throttling starts
    throttle-seconds: 300
  # Replace secrets (tokens, passwords, bearer headers) with ***REDACTED***
  redact-secrets: true
  # Print an error/warning count summary when the plugin shuts down
  summary-on-shutdown: true
